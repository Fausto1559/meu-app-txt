name: Recovery security and build audit

on:
  push:
    branches:
      - recuperacao/build-2026-11-05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Synchronize lockfile with package manifest
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(deps): synchronize lockfile after removing unused dependencies'
            git push
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full dependency audit
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-full.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-full.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('FULL AUDIT COUNTS:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                name: v.name, title: v.title, range: v.range, url: v.url
              })
            }));
          }
          NODE

      - name: Run production dependency audit
        continue-on-error: true
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          console.log('PRODUCTION AUDIT COUNTS:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));
          }
          NODE

      - name: Enforce zero dependency vulnerabilities
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['npm-audit-full.json', 'npm-audit-production.json'];
          let failed = false;
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error('Missing audit report:', file);
              failed = true;
              continue;
            }
            let report;
            try {
              report = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch {
              console.error('Invalid audit report:', file);
              failed = true;
              continue;
            }
            const counts = report.metadata?.vulnerabilities;
            if (!counts || typeof counts.total !== 'number') {
              console.error('Audit report has no vulnerability summary:', file);
              failed = true;
              continue;
            }
            console.log(file + ':', JSON.stringify(counts));
            if (counts.total > 0) failed = true;
          }
          if (failed) {
            console.error('CI blocked: dependency vulnerabilities or incomplete audit results detected.');
            process.exit(1);
          }
          console.log('Dependency audit gate passed: zero vulnerabilities in full and production trees.');
          NODE

      - name: TypeScript typecheck
        run: npm run typecheck

      # Includes frontend coverage and API route startup/authentication tests.
      - name: Run automated tests
        run: npm test -- --run

      - name: Build application
        run: npm run build

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-npm-audit
          path: |
            npm-audit-full.json
            npm-audit-production.json
          if-no-files-found: warn
